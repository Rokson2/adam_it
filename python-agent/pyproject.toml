[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-agent"
version = "0.1.0"
description = "Adam - Personal AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Adam Team"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
memory = [
    "mem0ai>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
]
crypto = [
    "cryptography>=41.0.0",
    "sqlcipher3-wheels>=0.5.0",
]

[project.scripts]
adam = "adam.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["adam*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
