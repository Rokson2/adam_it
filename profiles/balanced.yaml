name: balanced
description: "Sensible defaults for personal use - Docker isolation, limited file access"

file_access:
  read:
    - ~/Documents
    - ~/Projects
    - ~/Desktop
    - ~/Downloads
    - ~/.adam/workspace
  write:
    - ~/.adam/workspace
  denied:
    - ~/.ssh
    - ~/.gnupg
    - ~/.password-store
    - ~/.adam/vault
    - ~/Library/Keychains
    - ~/.local/share/keyrings

container:
  runtime: docker
  network: false
  read_only_rootfs: true
  memory_limit_mb: 512
  cpu_limit_percent: 50
  timeout_seconds: 300

audit:
  log_file_ops: true
  log_shell_cmds: true
  log_model_calls: false
  retention_days: 30
